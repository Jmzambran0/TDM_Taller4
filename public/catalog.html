<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Gestión</a></li>
            <li><a href="catalog.html">Catálogo</a></li>
        </ul>
    </nav>

    <h1>Catálogo de Items</h1>

    <div id="catalogContainer" class="catalog-grid">
        <!-- Aquí se van a renderizar las tarjetas con los items -->
    </div>
     <div id="catalogo-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-catalogo-name"></h2>
                <span class="close-modal">&times;</span>
            </div>
            <img src="" alt="Catalogo" id="modal-catalogo-img">
            <p class="pokemon-id" id="modal-pokemon-id"></p>

            <div class="modal-info">
                <p><strong>Descripción:</strong><span id="modal-pokemon-height"></span></p>
                <p><strong>Precio:</strong><span id="modal-pokemon-weight"></span></p>
                <p><strong>Talla:</strong><span id="modal-pokemon-abilities"></span></p>
                <p><strong>Stock:</strong><span id="modal-pokemon-abilities"></span></p>
            </div>
        </div>
    </div>
    <script type="module" src="./js/catalog.js"></script>
</body>
</html>
