<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo - Tienda Online</title>

    <!-- ---- PWA: manifiesto + apariencia en móvil ---- -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Meta tag PWA actualizado -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Catálogo público de productos de la Tienda Online." />

    <!-- CSS generado por Tailwind (RUTA CORREGIDA) -->
    <link rel="stylesheet" href="/css/styles.css?v=1.0" />
</head>

<body class="min-h-screen bg-surface text-ink antialiased">
    <!-- ============ NAVBAR ============ -->
    <nav class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
            <span class="flex items-center gap-2 font-semibold">
                <img src="/icons/icon-192.png" alt="" class="h-7 w-7 rounded-md" />
                TDM
            </span>

            <ul class="flex items-center gap-1 text-sm">
                <li>
                    <a href="/index.html" class="rounded-lg px-3 py-1.5 text-slate-600 hover:bg-slate-100">Gestión</a>
                </li>
                <li>
                    <a href="/catalog.html"
                        class="rounded-lg bg-brand-50 px-3 py-1.5 font-medium text-brand-700">Catálogo</a>
                </li>
            </ul>

            <div class="ml-auto flex items-center gap-2">
                <!-- Estado Offline -->
                <span id="offlineBadge" hidden
                    class="rounded-full bg-amber-100 px-2.5 py-1 text-xs font-medium text-amber-800">
                    Sin conexión
                </span>
                <!-- Botón Instalar PWA -->
                <button id="installBtn" hidden class="btn btn-ghost !py-1.5 text-xs">
                    Instalar app
                </button>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-6xl px-4 py-8">
        <header class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight">TIENDA ONLINE</h1>
            <p class="mt-1 text-sm text-slate-500">
                Explora los productos disponibles en nuestro catálogo.
            </p>
        </header>

        <!-- Grid donde se renderizan los items del catálogo -->
        <div id="catalogContainer" class="grid gap-1 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5"></div>
    </main>

    <!-- ============ MODAL DE DETALLES DEL PRODUCTO ============ -->
    <div id="catalogo-modal" hidden
        class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm">
        <div class="modal-content relative w-full max-w-lg rounded-card border border-slate-200 bg-white p-6 shadow-xl">
            <!-- Botón de cerrar -->
            <button type="button"
                class="close-modal absolute right-4 top-4 flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600"
                aria-label="Cerrar modal">
                &times;
            </button>

            <p id="modal-catalogo-id" class="mb-4 text-xs font-mono text-slate-400"></p>

            <div class="mb-4 aspect-square w-fit overflow-hidden rounded-lg bg-slate-100">
                <img id="modal-catalogo-img" src="" alt="Producto" class="h-full w-full object-contain" />
            </div>

            <!-- Título e Imagen -->
            <h2 id="modal-catalogo-name" class="text-xl font-bold text-slate-800 pr-8"></h2>

            <!-- Detalles e información del producto -->
            <div class="modal-info space-y-2 text-sm">
                <p class="text-slate-600">
                    <strong class="font-medium text-slate-800">Descripción: </strong>
                    <span id="modal-catalogo-descripcion"></span>
                </p>
                <p class="text-slate-600">
                    <strong class="font-medium text-slate-800">Precio: </strong>
                    <span id="modal-catalogo-precio" class="font-semibold text-brand-700"></span>
                </p>
                <div class="flex items-center gap-2 pt-2">
                    <p class="text-slate-600">
                        <strong class="font-medium text-slate-800">Categoría: </strong>
                        <span id="modal-catalogo-categoria"
                            class="tag rounded-md bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700"></span>
                    </p>
                    <p class="text-slate-600">
                        <strong class="font-medium text-slate-800">Stock: </strong>
                        <span id="modal-catalogo-stock"
                            class="tag rounded-md bg-brand-50 px-2 py-0.5 text-xs font-medium text-brand-700"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/catalog.js"></script>
    <script type="module" src="/js/pwa.js"></script>
</body>

</html>
